<!DOCTYPE html>
<html>

<head>
  <title>Baseline</title>
  <meta charset="utf-8" />
  <meta name="title" content="Baseline: Lightweight, imperative UI framework for building fast web apps." />
  <meta name="description"
    content="Lightweight, imperative UI framework for building fast web apps. No virtual DOM, no magic, no dependencies." />
  <meta name="theme-color" content="black" />
  <meta http-equiv="Content-type" content="text/html" />
  <meta name="mobile-web-app-capable" content="yes" <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="format-detection" content="date=no" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="msapplication-tap-highlight" content="no" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="shortcut icon" href="/icon.png" />
  <link rel="icon" sizes="512x512" href="/icon.png" />
  <link rel="stylesheet" href="/bundle.css">
  <style>
    *:not(input) {
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      -webkit-tap-highlight-color: transparent;
    }

    *:focus {
      outline: none;
    }

    * {
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
      font-family: "Open sans", "Samim", "Lucida Grande", "Lucida Sans", Arial,
        sans-serif;
      word-spacing: -2px;
    }

    html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input,
    input:before,
    input:after {
      border-radius: 0;
      -webkit-appearance: none;
      appearance: none;
      -webkit-user-select: initial;
      user-select: initial;
    }

    input,
    textarea,
    button,
    select,
    a {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    input[type="text"],
    input[type="button"] {
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-touch-callout: none;
      position: fixed;
      color: #2a2a2a;
    }

    .fade {
      animation: fade 1s;
      animation-iteration-count: infinite;
    }

    @keyframes fade {
      0% {
        opacity: 0.2;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.2;
      }
    }

    .highlight {
      animation: highlightAnimation 1s forwards;
    }

    @keyframes highlightAnimation {
      0% {
        background-color: yellow;
      }

      100% {
        background-color: transparent;
      }
    }

    .shake {
      animation: shakeAnimation 0.5s ease-in-out;
      display: inline-block;
      position: relative;
    }

    @keyframes shakeBackground {
      0% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-3px);
      }

      35% {
        transform: translateY(-2px);
      }

      50% {
        transform: translateX(3px);
      }

      75% {
        transform: translateX(-3px);
      }

      85% {
        transform: translateY(-2px);
      }

      100% {
        transform: translateX(0);
      }
    }

    .shake::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ffb4cc;
      z-index: -1;
      animation: shakeBackground 0.5s ease-in-out infinite;
    }
  </style>
</head>

<body>
  <!-- <script src="inobounce.min.js"></script> -->
  <script src="/bundle.js"></script>

  </script>
</body>

</html>
